androidx-camera-camera-lifecycle={group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraLife"}
androidx-camera-camera-view={group = "androidx.camera", name = "camera-view", version.ref = "cameraView"}
vision-common = { group = "com.google.mlkit", name = "vision-common", version.ref = "visionCommon" }
google-accompanist-permissions={group="com.google.accompanist",name="accompanist-permissions",version.ref="accompanist"}
play-services-mlkit-barcode-scanning = { group = "com.google.android.gms", name = "play-services-mlkit-barcode-scanning", version.ref = "playServicesMlkitBarcodeScanning" }
squareup-retrofit={group='com.squareup.retrofit2', name= 'retrofit', version.ref='retrofit' }
squareup-retrofit-json={group='com.squareup.retrofit2', name= 'converter-gson', version.ref='retrofitjson' }
