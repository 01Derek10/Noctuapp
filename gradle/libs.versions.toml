composeMaterialIconsExtended={group= 'androidx.compose.material', name= 'material-icons-extended',version.ref = "composeMaterialIconsExtended"}
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
