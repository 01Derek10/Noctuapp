[versions]
agp = "8.4.0"
kotlin = "1.9.0"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.7.0"
activityCompose = "1.9.0"
composeBom = "2024.05.00"
composeMaterialIconsExtended="1.6.7"
navigationCompose = "2.7.7"
cameraCamera="1.3.3"
cameraLife="1.3.3"
cameraView="1.3.3"
visionCommon = "17.3.0"
