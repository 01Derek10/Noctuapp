kotlinx-serialization={group="org.jetbrains.kotlinx",name="kotlinx-serialization-json",version="1.2.1"}
androidx-room-runtime={group="androidx.room",name="room-runtime",version.ref="room_version"}
androidx-room-ktx={group="androidx.room",name="room-ktx",version.ref="room_version"}
androidx-room-compiler={group="androidx.room",name="room-compiler",version.ref="room_version"}
androidx-lifecycle-viewmodel={group="androidx.compose.runtime",name="runtime-livedata",version.ref="lifecycleViewModel"}
logging-interceptor={group="com.squareup.okhttp3",name="logging-interceptor",version.ref="logginHtpp"}

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
serialization={id= 'org.jetbrains.kotlin.plugin.serialization', version= '1.5.10'}
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }

